# HealthGo — Supabase local dev config.
# `supabase start` reads this. Project ref is set via `supabase link` for deploy.
project_id = "healthgo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true

# Functions that are called before a user has a session must skip JWT
# verification (they authenticate the user themselves).
[functions.otp-request]
verify_jwt = false
[functions.otp-verify]
verify_jwt = false
# The dispenser hardware authenticates with a shared secret header, not a JWT.
[functions.dispenser-release]
verify_jwt = false
# seed-demo authenticates with its own SEED_SECRET header.
[functions.seed-demo]
verify_jwt = false
# app-config is public posture only (no secrets) and must render before login.
[functions.app-config]
verify_jwt = false
# admin-export-surveys authenticates with ADMIN_EXPORT_SECRET, not a user JWT.
[functions.admin-export-surveys]
verify_jwt = false
