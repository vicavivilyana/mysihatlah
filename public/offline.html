<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthGo — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #fbf7f0;
        color: #12312b;
        text-align: center;
        padding: 24px;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: #0f766e;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 16px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #6b7a73; max-width: 20rem; }
      button {
        margin-top: 20px;
        border: none;
        background: #0f766e;
        color: #fff;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <div class="badge">♥</div>
    <h1>You're offline</h1>
    <p>HealthGo needs a connection for live data. Your saved reminders still work — reconnect to load the rest.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
